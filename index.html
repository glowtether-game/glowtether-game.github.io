function frame(t){
  const raw=Math.min(0.05,(t-last)/1000||0);last=t;tAll+=raw;
  if(slowT>0){slowT-=raw;if(slowT<=0)slow=1;}
  if(state==='play'||state==='clear'){
    const dt=raw*slow;acc+=dt;let n=0;while(acc>=DT&&n<12){stepSim();acc-=DT;n++;}
    if(state==='play'){played+=raw;if(bannerT>0)bannerT-=raw;}else clearT+=raw;
    if(fellT>0){fellT-=raw;if(fellT<=0){if(runMax>ghostH&&cur.length>8){ghostH=runMax;ghost=cur.slice();}resetRun(false);}}
    const target=Math.min(sim.y-40,-230);cam+=(target-cam)*Math.min(1,raw*4.5);
    shake*=Math.pow(0.001,raw);if(shake<0.1)shake=0;
    for(const p of parts){p.l-=raw;p.x+=p.vx*raw;p.y+=p.vy*raw;p.vy+=500*raw;}parts=parts.filter(p=>p.l>0);
    for(const d of debris){d.l-=raw;d.x+=d.vx*raw;d.vy+=900*raw;d.y+=d.vy*raw;}debris=debris.filter(d=>d.l>0);
    for(const k in bounceT){bounceT[k]-=raw;if(bounceT[k]<=0)delete bounceT[k];}
    for(const p of pops)p.t-=raw;pops=pops.filter(p=>p.t>0);
    if(narr.t>0)narr.t-=raw;
    musLevel=S?Math.min(2,Math.floor(Math.max(0,hOf(sim.y))/topH*3)):0;
    if(reelG&&ac){const on=sim.rope&&sim.hold&&!muted;reelG.gain.value=on?0.025:0;if(on)reelO.frequency.value=160+Math.hypot(sim.vx,sim.vy)*0.45;}
  }else{if(reelG)reelG.gain.value=0;if(state==='over'){overT+=raw;shake*=Math.pow(0.001,raw);if(shake<0.1)shake=0;for(const p of parts){p.l-=raw;p.x+=p.vx*raw;p.y+=p.vy*raw;p.vy+=500*raw;}parts=parts.filter(p=>p.l>0);}}
  draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();try{if(ac&&ac.state==='running')ac.suspend();}catch(e){}}else{try{if(ac&&ac.state==='suspended')ac.resume();}catch(e){}}});
addEventListener('pagehide',persist);
window.__game={startEndless,get mode(){return mode;},get voidY(){return voidY;},pause:pauseGame,STAGES,start:startStage,menu:toMenu,press:doPress,release:doRelease,get sim(){return sim;},get state(){return state;},get best(){return best;},save};
if(!save.cleared&&!save.life&&!(save.end>0)&&!Object.keys(save.time||{}).length)startStage(0);
requestAnimationFrame(frame);
})();
</script>
