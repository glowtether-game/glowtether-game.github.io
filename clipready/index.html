<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipready</title>
<meta name="description" content="Turn iPhone videos (MOV) into MP4 with no quality loss, in seconds, and voice memos (M4A) into MP3. Runs on your PC; nothing is uploaded.">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar"><div class="brand"><img src="icons/icon-192.png" alt="" width="26" height="26"><span>Clipready</span></div></header>
<main id="main">
  <p class="msg" id="msg" hidden></p>
  <section id="start" class="empty">
    <div class="drop" id="drop" tabindex="0">
      <h1 data-i18n="drop">Drop iPhone videos (MOV) or voice memos (M4A) here</h1>
      <p class="sub" data-i18n="sub">Converted on this PC. Nothing is uploaded.</p>
      <div class="row"><button class="btn primary big" id="fileBtn" data-i18n="chooseFiles">Choose files</button><button class="btn big" id="dirBtn" data-i18n="chooseFolder">Choose a folder</button></div>
    </div>
    <p class="tag" data-i18n="tag">MOV to MP4 with no quality loss, in seconds. Voice memos to MP3.</p>
  </section>
  <section id="busy" class="busy" hidden><div class="spin"></div><span id="busyText"></span><progress id="bar" max="1" value="0" hidden></progress></section>
  <section id="report" class="card" hidden>
    <h2 data-i18n="report">What we found</h2>
    <ul class="stats" id="stats"></ul>
    <p class="note" id="hevcNote" hidden></p>
    <p class="note" id="spatialNote" hidden></p>
    <div id="audioOpts">
      <label><span data-i18n="optMp3">MP3 quality</span>
        <select id="kbps"><option value="64" data-i18n="kbps64">64 kbps</option><option value="128" selected data-i18n="kbps128">128 kbps</option><option value="192" data-i18n="kbps192">192 kbps</option></select></label>
      <label><input type="checkbox" id="optDate" checked> <span data-i18n="optDate">Start MP3 file names with the recording date</span></label>
    </div>
    <div id="videoOpts">
      <label><input type="checkbox" id="optGeo"> <span data-i18n="optGeo">Remove location from the videos</span> <span class="badge" id="optGeoBadge">Pro</span></label>
    </div>
    <p class="note" id="freeNote" hidden></p>
    <div class="row"><button class="btn primary big" id="startBtn" data-i18n="start">Convert and save</button></div>
  </section>
  <section id="finish" class="card" hidden>
    <h2 data-i18n="done">Done</h2>
    <p id="doneText"></p>
    <p class="note warn" id="failText" hidden></p>
    <p class="note" id="freeDone" hidden></p>
    <div class="row"><button class="btn primary" id="freeBtn">Pro</button><button class="btn" id="againBtn" data-i18n="again">Convert more</button></div>
  </section>
</main>
<input type="file" id="fileIn" accept=".mov,.qt,.m4a,.qta,.aac,.caf,.wav,.aif,.aiff,video/quicktime,audio/*" multiple hidden>
<input type="file" id="dirIn" webkitdirectory hidden>
<footer class="foot"><a href="privacy.html" data-i18n="privacy">Privacy</a><span>·</span><span id="ver"></span><span>·</span><a href="vendor/LICENSE-lamejs.txt">LAME (LGPL)</a><span>·</span><a href="https://lame.sourceforge.io/" rel="noopener">lame.sourceforge.io</a><span>·</span><a href="vendor/LICENSE-alac.txt">ALAC (Apache 2.0)</a></footer>
<script type="module" src="app.js"></script>
</body>
</html>
